# nginx:托管前端静态资源并反代 API 与 SSE(ADR-07)
# TLS 终止:生产环境建议挂载证书并启用下方 https server(见注释)。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 分块上传单块为 4 MiB(ADR-06),nginx 默认 1m 会让 PUT 分块直接 413
    client_max_body_size 8m;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源带哈希指纹,可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存:避免升级后旧 index 引用已删除的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 server 级一致(显式声明,便于阅读)
        client_max_body_size 8m;
    }

    # SSE:必须即时转发,禁止缓冲,超时放宽
    location /events {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

